# =====================================================
# GEO-SaaS 全域AI搜索优化平台 - Docker Compose（容器内网部署形态）
# -----------------------------------------------------
# 设计要点（Linux / 1Panel 共存适配）：
#   1. 内部服务（mysql/redis/rabbitmq/backend/phpmyadmin）端口一律不暴露到宿主，
#      通过 geo-saas-net 容器网络按服务名互访（"端口在容器内"）。
#      - 彻底规避与 1Panel 自带服务撞端口（如 1Panel-MySQL 的 3306、dataease 的 8080）。
#   2. 唯一对外入口是前端 Nginx 的 80 端口；Nginx 将 /api 反代到 backend:8080。
#   3. 后端/前端 Dockerfile 均为多阶段构建，无需宿主机 JDK/Maven/Node，纯 Docker 一键部署。
#   4. 生产环境必填项（JWT_SECRET / MYSQL_PASSWORD 等）缺省时启动即 fail-fast。
# =====================================================

services:
  mysql:
    image: mysql:8.4
    container_name: geo-saas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: geo_saas
    # 端口在容器内：不发布宿主端口（避免与 1Panel-MySQL 的 3306 冲突）
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./geo-saas-backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - geo-saas-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: geo-saas-redis
    restart: unless-stopped
    # 端口在容器内：不发布宿主端口
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - geo-saas-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: geo-saas-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      # 变量名与 backend 保持一致（避免自定义密码时两边不一致导致后端连不上 MQ）
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    # 端口在容器内：不发布宿主端口（管理台 15672 也仅容器内可访问）
    # ports:
    #   - "5672:5672"
    #   - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - geo-saas-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./geo-saas-backend
      dockerfile: docker/Dockerfile
    image: geo-saas-backend
    container_name: geo-saas-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # prod profile 下没有默认值，缺失会导致启动失败（刻意 fail-fast）
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 中设置 JWT_SECRET，可用 openssl rand -base64 32 生成}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SIMULATION_ENABLED: ${AI_SIMULATION_ENABLED:-true}
    # 端口在容器内：不发布宿主端口（前端 Nginx 通过内部网络反代 /api 到 backend:8080）
    # ports:
    #   - "808009:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geo-saas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./geo-saas-frontend
      dockerfile: Dockerfile
    image: geo-saas-frontend
    container_name: geo-saas-frontend
    # 唯一对外入口：前端 Nginx 监听宿主 80，将 /api 反代到内部 backend:8080
    ports:
      - "127.0.0.1:8009:80"
    depends_on:
      - backend
    networks:
      - geo-saas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin：可视化管理 MySQL（开发/调试用），端口在容器内，不暴露宿主。
  # 需要从宿主访问时临时加 -p 8081:80 或在 1Panel 中做端口转发。
  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: geo-saas-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    # ports:
    #   - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - geo-saas-net
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  geo-saas-net:
    driver: bridge
